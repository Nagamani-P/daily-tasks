name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # With KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets set, the APK is signed with
      # your own release key (needed for Play Store). Without them it uses the
      # standard React Native debug key, which is fine for installing on your own phone.
      - name: Use release signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            python3 scripts/patch-signing.py
          else
            echo "No release key secret; signing with the debug key."
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: dailytasks
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/DailyTasks-$(node -p "require('./app.json').expo.version").apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyTasks-apk
          path: out/*.apk
          retention-days: 30
